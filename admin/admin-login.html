<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Aaliya Book Publication</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../icons/favicon-64.png">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<nav class="navbar"><div class="container">
  <a href="../index.html" class="brand">
    <span class="brand-fallback">AB</span>
    <span data-company-name>Aaliya Book Publication</span>
    <span class="badge-admin">ADMIN</span>
  </a>
</div></nav>

<div class="form-wrap">
  <h2>Admin Login</h2>
  <form id="admin-login-form">
    <div class="field"><label for="ad-email">Email</label><input type="email" id="ad-email" required></div>
    <div class="field"><label for="ad-password">Password</label><input type="password" id="ad-password" required></div>
    <button type="submit" class="btn btn-primary btn-block">Login</button>
    <div id="ad-msg" class="form-msg"></div>
  </form>
  <div class="form-alt"><a href="#" id="forgot-password-link">Password bhool gaye?</a></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/security.js"></script>
<script src="admin.js"></script>
</body>
</html>
