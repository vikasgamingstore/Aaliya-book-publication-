<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apply | Aaliya Book Publication</title><meta name="robots" content="noindex">
<script>
  // Applying now happens inside the profile (Projects tab)
  (function () {
    var p = new URLSearchParams(window.location.search).get("project");
    if (p && /^[0-9a-f-]{36}$/i.test(p)) sessionStorage.setItem("abp-pending-project", p);
    window.location.replace("dashboard.html#project");
  })();
</script>
</head><body><p style="font-family:sans-serif;padding:24px">Opening your profile... <a href="dashboard.html#project">Continue</a></p></body></html>
