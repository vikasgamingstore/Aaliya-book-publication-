<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Customer Registration — Apply for Handwriting Work From Home | Aaliya Book Publication</title>
<meta name="description" content="Register with Aaliya Book Publication to apply for handwriting work from home projects across India. Quick online registration with secure account setup.">
<meta name="theme-color" content="#12284C">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-64.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aaliya Books">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar"><div class="container">
  <a href="index.html" class="brand">
    <img data-company-logo style="display:none" alt="logo">
    <span class="brand-fallback">AB</span>
    <span data-company-name>Aaliya Book Publication</span>
  </a>
</div></nav>

<div class="form-wrap">
  <h2>Create Your Account</h2>
  <form id="signup-form">
    <div class="field">
      <label for="su-name">Full Name</label>
      <input type="text" id="su-name" required autocomplete="name">
    </div>

    <div class="field">
      <label for="su-mobile">Mobile Number</label>
      <input type="tel" id="su-mobile" required inputmode="numeric" maxlength="10" autocomplete="tel" placeholder="10-digit mobile number">
    </div>

    <div class="field">
      <label for="su-email">Email Address</label>
      <input type="email" id="su-email" required autocomplete="email">
    </div>

    <div class="field">
      <label for="su-password">Password</label>
      <div class="pw-wrap">
        <input type="password" id="su-password" required autocomplete="new-password" placeholder="At least 8 characters">
        <button type="button" class="pw-toggle" data-toggle="su-password" aria-label="Show password">Show</button>
      </div>
      <p class="field-hint">Use at least 8 characters with both letters and numbers.</p>
    </div>

    <div class="field">
      <label for="su-password2">Confirm Password</label>
      <div class="pw-wrap">
        <input type="password" id="su-password2" required autocomplete="new-password" placeholder="Type the same password again">
        <button type="button" class="pw-toggle" data-toggle="su-password2" aria-label="Show password">Show</button>
      </div>
      <p class="field-hint" id="pw-match-hint"></p>
    </div>

    <div class="field">
      <label for="su-referral">Referral Code (optional)</label>
      <input type="text" id="su-referral" placeholder="Enter a referral code if someone referred you">
      <p class="field-hint" id="referral-hint"></p>
    </div>

    <div id="captcha-box" style="margin-bottom:14px"></div>
    <button type="submit" class="btn btn-primary btn-block">Create Account</button>
    <div id="su-msg" class="form-msg"></div>
  </form>
  <div class="form-alt">Already have an account? <a href="login.html">Log in</a></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/main.js"></script>
<script src="js/pwa.js"></script>
<script src="js/security.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
