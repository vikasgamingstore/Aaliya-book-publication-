<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | Aaliya Book Publication</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#12284C">
<link rel="icon" href="icons/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar"><div class="container">
  <a href="index.html" class="brand">
    <img data-company-logo style="display:none" alt="Aaliya Book Publication logo">
    <span class="brand-fallback">AB</span>
    <span data-company-name>Aaliya Book Publication</span>
  </a>
</div></nav>

<main class="section">
  <div class="container">
    <div class="form-wrap" style="margin:0 auto">
      <h2>Set a New Password</h2>
      <p class="field-hint" style="margin-bottom:18px">Enter your new password below. You will be logged in straight away.</p>

      <div id="reset-checking" class="form-msg">Checking your reset link...</div>

      <form id="reset-form" style="display:none">
        <div class="field">
          <label for="rp1">New Password</label>
          <input type="password" id="rp1" required autocomplete="new-password">
        </div>
        <div class="field">
          <label for="rp2">Confirm New Password</label>
          <input type="password" id="rp2" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Update Password</button>
        <div id="reset-msg" class="form-msg"></div>
      </form>

      <div id="reset-invalid" style="display:none">
        <div class="form-msg error">
          This reset link is invalid or has expired. Password reset links work only once and expire after a while.
        </div>
        <a href="admin/admin-login.html" class="btn btn-outline btn-block" style="margin-top:14px">Back to Admin Login</a>
        <a href="login.html" class="btn btn-outline btn-block" style="margin-top:10px">Customer Login</a>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/main.js"></script>
<script>
(async function () {
  const checking = document.getElementById("reset-checking");
  const form = document.getElementById("reset-form");
  const invalid = document.getElementById("reset-invalid");

  // Supabase puts the recovery token in the URL hash and creates a temporary session
  let hasSession = false;
  for (let i = 0; i < 12; i++) {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) { hasSession = true; break; }
    await new Promise(r => setTimeout(r, 250));
  }

  checking.style.display = "none";
  if (hasSession) {
    form.style.display = "block";
  } else {
    invalid.style.display = "block";
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("reset-msg");
    const pw1 = document.getElementById("rp1").value;
    const pw2 = document.getElementById("rp2").value;

    if (pw1.length < 8) { msg.textContent = "Password must be at least 8 characters."; msg.className = "form-msg error"; return; }
    if (!/[a-zA-Z]/.test(pw1) || !/[0-9]/.test(pw1)) { msg.textContent = "Use both letters and numbers."; msg.className = "form-msg error"; return; }
    if (pw1 !== pw2) { msg.textContent = "The two passwords do not match."; msg.className = "form-msg error"; return; }

    const btn = form.querySelector('button[type="submit"]');
    btn.disabled = true; btn.textContent = "Updating...";

    const { error } = await supabaseClient.auth.updateUser({ password: pw1 });

    if (error) {
      msg.textContent = error.message;
      msg.className = "form-msg error";
      btn.disabled = false; btn.textContent = "Update Password";
      return;
    }

    msg.textContent = "Password updated. Redirecting you to login...";
    msg.className = "form-msg ok";

    // Check whether this account is an admin, then send them to the right login
    const { data: { session } } = await supabaseClient.auth.getSession();
    let isAdmin = false;
    if (session) {
      const { data: profile } = await supabaseClient.from("profiles").select("is_admin").eq("id", session.user.id).single();
      isAdmin = !!profile?.is_admin;
    }
    await supabaseClient.auth.signOut();
    setTimeout(() => {
      window.location.href = isAdmin ? "admin/admin-login.html" : "login.html";
    }, 1800);
  });
})();
</script>
</body>
</html>
